<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Me - Vinay</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>
<body class="contact-page">
<header class="site-header">
    <div class="container header-inner">
        <div class="logo">VK</div>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="resume.html" class="nav-link">Resume</a></li>
                <li><a href="contact.html" class="nav-link active">Contact</a></li>
            </ul>
        </nav>
    </div>
</header>

<main class="container">
    <header class="page-header fade-in">
        <h1>Contact Me</h1>
        <p>Feel free to reach out using the form below.</p>
    </header>

    <section class="contact-section fade-in">
        <form id="contact-form" novalidate>
            <div class="form-group">
                <label for="name">Name<span class="required">*</span></label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                <small class="error-message" id="name-error"></small>
            </div>

            <div class="form-group">
                <label for="email">Email<span class="required">*</span></label>
                <input type="email" id="email" name="email" placeholder="yourname@example.com" required>
                <small class="error-message" id="email-error"></small>
            </div>

            <div class="form-group">
                <label for="subject">Subject<span class="required">*</span></label>
                <input type="text" id="subject" name="subject" placeholder="Subject of your message" required>
                <small class="error-message" id="subject-error"></small>
            </div>

            <div class="form-group">
                <label for="message">Message<span class="required">*</span></label>
                <textarea id="message" name="message" rows="5" placeholder="Type your message here..." required></textarea>
                <small class="error-message" id="message-error"></small>
            </div>

            <button type="submit" class="btn primary-btn">Send Message</button>
            <p class="form-status" id="form-status"></p>
        </form>
    </section>
</main>

<footer class="site-footer">
    <div class="footer-inner container">
        <p>&copy; <span id="year"></span> Vinay. All rights reserved.</p>
    </div>
</footer>
</body>
</html>
